<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pong Game - Social Preview</title>
<!-- Renders the 1280x640 social preview from this repository's own assets. -->
</head>
<body>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:640px;overflow:hidden;
     font-family:"Segoe UI",system-ui,sans-serif}
.card{position:relative;width:1280px;height:640px;background:#141414;overflow:hidden}
.court{position:absolute;left:40px;top:40px;right:40px;bottom:40px;
       border:3px solid rgba(220,220,220,.55)}
.net{position:absolute;left:50%;top:56px;bottom:56px;width:5px;margin-left:-2.5px;
     background:repeating-linear-gradient(180deg,#505050 0 22px,transparent 22px 40px)}
.paddle{position:absolute;width:14px;height:190px;border-radius:2px}
.pl{left:74px;top:128px;background:#00FF7F;box-shadow:0 0 34px rgba(0,255,127,.55)}
.pr{right:74px;top:150px;background:#FF4500;box-shadow:0 0 34px rgba(255,69,0,.55)}
.ball{position:absolute;width:34px;height:34px;border-radius:3px;background:#F0F0F0;
      box-shadow:0 0 32px rgba(240,240,240,.65)}
.b1{left:470px;top:360px;opacity:.16}
.b2{left:556px;top:326px;opacity:.30}
.b3{left:642px;top:290px;opacity:.52}
.b4{left:734px;top:250px}
.score{position:absolute;top:74px;font-variant-numeric:tabular-nums;font-weight:700;
       font-size:104px;letter-spacing:.04em;line-height:1}
.sl{left:calc(50% - 150px);color:#00FF7F;text-shadow:0 0 30px rgba(0,255,127,.35)}
.sr{left:calc(50% + 74px);color:#FF4500;text-shadow:0 0 30px rgba(255,69,0,.35)}
.tag{position:absolute;left:78px;top:74px;font-size:17px;font-weight:700;letter-spacing:.20em;
     color:rgba(255,255,255,.62)}
.plate{position:absolute;left:78px;bottom:96px}
.title{font-size:112px;font-weight:700;color:#fff;letter-spacing:-.02em;line-height:.94}
.sub{margin-top:22px;font-size:22px;font-weight:700;letter-spacing:.16em;color:#00FF7F}
.by{margin-top:14px;font-size:22px;font-weight:600;letter-spacing:.05em;color:rgba(255,255,255,.94)}
</style>
<div class="card">
  <div class="court"></div>
  <div class="net"></div>
  <div class="score sl">07</div><div class="score sr">05</div>
  <div class="paddle pl"></div><div class="paddle pr"></div>
  <div class="ball b1"></div><div class="ball b2"></div>
  <div class="ball b3"></div><div class="ball b4"></div>
  <div class="tag">PERSONAL PROJECT</div>
  <div class="plate">
    <div class="title">PONG</div>
    <div class="sub">PYTHON &middot; PYGAME &middot; 2021</div>
    <div class="by">AMEY THAKUR &middot; MEGA SATISH</div>
  </div>
</div>
</body>
</html>
